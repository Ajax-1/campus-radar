# 采集一轮并发布岗位快照，其他实例设置 RADAR_SNAPSHOT_URL 后下载它，不用各自请求官网。
# 快照发布到 data 分支，每次覆盖，不会让仓库越来越大。
# 确认要公开发布后，取消下面 schedule 的注释即可每天自动运行。
name: Snapshot

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "30 23 * * *"  # 北京时间 7:30

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -DskipTests package
      - name: Collect and export
        run: java -jar target/campus-radar.jar --server.port=0 --radar.collect.when-empty=false --radar.snapshot.export-path=out/jobs.json.gz
      - name: Publish
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json.gz
          git commit -q -m "snapshot $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" data
