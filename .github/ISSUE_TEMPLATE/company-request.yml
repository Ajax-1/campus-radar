name: 想要收录的公司
description: 告诉我们还缺哪家公司
labels: ["数据源"]
body:
  - type: input
    id: company
    attributes:
      label: 公司名
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 校招官网地址
      description: 地址形如 xxx.jobs.feishu.cn 的话，加一行配置就能接入
      placeholder: https://
    validations:
      required: true
